<VirtualHost *:8080>
    ServerName localhost
    DocumentRoot /var/www/html/public
    ServerSignature Off
    SetEnvIf Authorization "(.+)" HTTP_AUTHORIZATION=$1
    <Directory /var/www/html>
        AllowOverride None
        Require all denied
    </Directory>
    <Directory /var/www/html/public>
        Options -Indexes -Includes -ExecCGI
        AllowOverride None
        Require all granted
        FallbackResource /index.php
        <FilesMatch "^\.">
            Require all denied
        </FilesMatch>
    </Directory>
    # No registrar query strings, cuerpos ni cabeceras Authorization.
    LogFormat "%h %m %U %>s %b" kitchenware
    CustomLog /proc/self/fd/1 kitchenware
    ErrorLog /proc/self/fd/2
</VirtualHost>
