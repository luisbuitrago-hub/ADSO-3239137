# Independiente de compose.yaml: no monta volúmenes ni usa el puerto de desarrollo.
services:
  postgres-test:
    image: postgres:16
    environment:
      POSTGRES_DB: kitchenware_test
      POSTGRES_USER: kitchenware_test
      # Credencial pública exclusiva del contenedor efímero de pruebas.
      POSTGRES_PASSWORD: kitchenware_test_only
    ports:
      - "127.0.0.1::5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kitchenware_test -d kitchenware_test"]
      interval: 1s
      timeout: 3s
      retries: 30
